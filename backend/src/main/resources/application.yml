spring:
  application:
    name: risk-platform
  datasource:
    url: jdbc:postgresql://localhost:5432/riskplatform
    username: risk_user
    password: risk_pass
  jpa:
    # Off on purpose. Open Session In View keeps the Hibernate session (and
    # its JDBC connection) for the whole HTTP request, which would hold a
    # pooled connection while a risk calculation waits on the quant engine.
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    show-sql: true
  jackson:
    time-zone: Asia/Kolkata
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB      

server:
  port: 8080

springdoc:
  swagger-ui:
    path: /swagger-ui.html

quant-engine:
  base-url: http://localhost:8000 